# 영어 pretrained 에서 바로 한글 적응 (Phase 1 생략, 실사용 레시피)
#   python train/korean_from_en.py
_base_: base.yaml

run:
  out: finetune_runs/korean_en2ko
  resume: null           # 영어 pretrained 에서 시작
  num_workers: 16
  save_every: 1000
  log_every: 10
  save_samples: 16

optim:
  batch_size: 16         # virtual batch 256 = 16 × 16 (max_img_len 8192 에서 VRAM 35GB)
  grad_accum: 16
  lr: 5.0e-5
  max_steps: 20000
  max_img_len: 8192

data:
  style_words: [1, 8]
  gen_words: [1, 32]
  text_dropout: 0.05
  style_text_dropout: 0.10
  english_frac: 0.15     # 15% 라틴 폰트 영어 = 영어 스타일 다양성 보강

val:
  val_every: 1000        # held-out(unseen 16폰트) val loss
  val_batches: 4
  val_seed: 1234
