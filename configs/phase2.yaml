# Phase 2 — 긴 줄 적응 (논문 5000 step 추가)
# Phase 1 ckpt 에서 resume 해서 긴 style/gen 으로 이어 학습한다.
#   python train/phase2.py
_base_: base.yaml

run:
  out: finetune_runs/korean_p2
  resume: finetune_runs/korean_p1/checkpoint_last.pth
  num_workers: 16
  save_every: 250
  log_every: 10
  save_samples: 16

optim:
  batch_size: 2          # virtual batch 256 = 2 × 128
  grad_accum: 128
  lr: 1.0e-4
  extra_steps: 5000      # resume step + 5000 (논문 Phase 2)

data:
  style_words: [1, 8]    # 논문 Phase 2 = 긴 줄
  gen_words: [1, 32]
  text_dropout: 0.05     # p_uncond
  style_text_dropout: 0.10   # p_drop — Phase 2 전용
