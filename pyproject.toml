[project]
name = "eruku-korean-finetuning"
version = "0.1.0"
description = "Eruku (autoregressive styled handwriting generation) Korean fine-tuning"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.9.0",
    "torchvision==0.24.0",
    "transformers>=5.5,<6",
    "diffusers>=0.32",
    "einops>=0.8",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",        # experiments/ 의 SSIM (common.py, vae_*_sweep.py)
    "pyarrow>=17",               # tools/fetch_corpus.py 의 HF parquet 읽기
    "pillow>=10",
    "fonttools>=4.50",
    "brotli>=1.1",
    "msgpack>=1.0",
    "nltk>=3.9",
    "tqdm>=4.66",
    "huggingface-hub>=0.34",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "pyyaml>=6",
    # InkSpire 재현(/data/work/dgkang/inkspire_korean)에서 쓰던 것. 코드는 옮겼지만 uv.lock 을
    # 다시 풀 이유가 없어 선언만 남긴다. 이 repo 에서 import 하는 곳은 없다.
    "peft>=0.18",
    "prodigyopt>=1.1",
    # eval/echo_metrics.py 의 LPIPS / FID / BFID. 선언이 빠져 있어 2026-09-14 에 5개 런
    # 평가가 통째로 ModuleNotFoundError 로 죽었다 — 다시 빠뜨리지 말 것.
    "lpips>=0.1.4",              # LPIPS(AlexNet)
    "pytorch-fid>=0.3",          # FID — InceptionV3 특징 + Frechet 거리
    "hwd @ git+https://github.com/aimagelab/HWD.git",   # BFID(Otsu 이진화 후 FID, HWD 공식)
    "gudhi>=3.13",               # hwd 의존(선언 안 돼 있어 수동 설치 필요했다)
    "matplotlib>=3.8",           # 〃
    "six>=1.17",                 # 〃
]

[project.optional-dependencies]
# TPS C++ 가속 백엔드 빌드용 (없어도 NumPy fallback 으로 학습 가능)
tps = ["pybind11>=2.12", "setuptools>=70"]

[tool.uv]
# torch GPU(cu12) wheel 은 PyPI 기본 인덱스에서 제공됨
